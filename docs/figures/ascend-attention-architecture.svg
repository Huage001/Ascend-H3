<title id="title">Ascend-H3 attention on NPU</title>
<desc id="desc">Four attention implementations: VSA, Veda, Spark and VDN. VSA, Veda and Spark use custom Ascend C operators alongside native operations. VDN combines NPU-native attention, TorchAir and NPU Graph optimizations.</desc>
